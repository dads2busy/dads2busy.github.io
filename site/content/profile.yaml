    Editorials:
      - title: The Political Roots of Hating Government
        authors:
          - "**Schroeder, A.D.**"
        date: "2012-04-10"
        journal: April 30. Roanoke Times and World News
        local_path: /downloads/The Political Roots of Hating Government, Schroeder.pdf
        slug: hating_govt
        subcategory: Editorials
        content: '<h3>Response to Editorial in Roanoke Times</h3>

          IN RESPONSE to the excellent May 14 commentary by Aaron D. Schroeder and Gary L. Wamsley, "The
          political roots of hating government":

          <br />

          It was a thoughtful, perceptive dialogue attempting to discourage us all from blaming, finger-pointing
          and judging. It is simpler, particularly when faced with absorbing the horror of the Oklahoma
          City bombing, to focus all of our anger and frustration on an individual or group such as the
          Michigan Militia.

          <br />

          Doing deep soul-searching and asking the hard questions suggested in the commentary will be more
          painful, but also more productive. It will help us focus on possible solutions instead of increasing
          our fear and hate with inflammatory words and actions. If we, as a nation, can talk to and really
          listen to one another, perhaps the Oklahoma City tragedy will have served some positive purpose.
          It will be a double tragedy if we use it only to divide and separate ourselves from one another,
          thereby raising higher the walls of fear, hate and intolerance already so sadly evident in this
          country.

          <br />

          POLLY WILSON

          <br />

          ROANOKE'
    Dissertation:
      - title:
          "Building Implementation Networks: Building Multi-organizational, Multi-sector Structures
          for Policy Implementation"
        authors:
          - "**Schroeder, A.D.**"
        date: "2012-07-31"
        journal: Virginia Polytechnic Institute and State University
        url: http://scholar.lib.vt.edu/theses/available/etd-05082001-162010/unrestricted/ImplementationNetworks.pdf
        slug: dissertation
        subcategory: Dissertation
        content:
          The purpose of this dissertation is the delineation of a new approach, or, more precisely,
          a new “role” and “methodological system,” for those persons engaged in building and managing multi-actor
          structures, or “networks,” for the purpose of policy implementation. As policy formulation and
          implementation can be viewed increasingly as taking place inter-organizationally, and consisting
          of individuals, special-interest groups, public organizations, private organizations, non-profits,
          etc., none of whom have the individual power to autonomously determine the strategies and actions
          of all the other actors, policy processes can no longer be viewed as the implementation of ex
          ante formulated goals, but instead must be seen as an interaction process in which actors exchange
          information about problems, preferences and means, and trade-off goals and resources. That is,
          the context of “getting things done” in the public sector is changing from a singular organizational
          context to a multiple-organization network context. Managerially, we must respond accordingly.
