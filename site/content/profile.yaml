      - title: "Smart Metadata in Action: The Social Impact Data Commons"
        authors:
          - Joanna Schroeder, Alan Wang
          - Kathryn Linehan, Joel Thurston
          - "**Aaron Schroeder**"
        date: "2025-11-21"
        doi: 10.48550/arXiv.2511.17694
        slug: smart_metadata_data_commons
        subcategory: Journal Publications (refereed)
        content:
          This article describes the use of metadata and standards in the Social Impact Data Commons
          to expose official statisticians to an innovative project built on actionable and evaluable metadata,
          which produces a FAIR data system. We begin by introducing the concept of the Data Commons, focusing
          on its features, and presenting an overview of current implementations of the Data Commons. We
          then present the core metadata case study, demonstrating how smart metadata support the Data Commons.
          We also present evaluations of our core metadata, including its adherence to the FAIR guidelines.
          We conclude with a discussion on our future metadata and standards-related projects to support
          the Social Impact Data Commons.
