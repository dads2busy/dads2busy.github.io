      - title:
          Network Organizational Development in the Public Sector. Journal of the American Society
          for Information Science
        authors:
          - Ward, R.
          - Wamsley, G.L.
          - "**Schroeder, A.D.**"
          - Robins, D.B.
        date: "2000-05-22"
        journal: Journal of the American Society for Information Science
        url: http://onlinelibrary.wiley.com/doi/10.1002/1097-4571(2000)9999:9999%3C::AID-ASI1004%3E3.0.CO;2-5/abstract
        slug: network_org
        subcategory: Journal Publications (refereed)
        content:
          Does information technology "pull" the organizational management toward change in terms
          of authority and control, or is information technology "pushed" through the organization, by management,
          to maintain its existing system of authority and control? These conflicting positions are explored
          through a case study of the Federal Emergency Management Agency's evolutionary relationship with
          information technologies.
        pages: vol. 51, no. 11
      - title: "Escalating in a Quagmire: The Changing Dynamics of the Emergency Management Policy Subsystem"
        authors:
          - Wamsley, G.L.
          - "**Schroeder, A.D.**"
        date: "1996-05-01"
        journal: Public Administration Review
        url: https://www.researchgate.net/publication/272574256_Escalating_in_a_Quagmire_The_Changing_Dynamics_of_the_Emergency_Management_Policy_Subsystem
        slug: quagmire
        subcategory: Journal Publications (refereed)
        content:
          "How has the federal emergency management system fared in post-Andrew era? When Hurricane
          Andrew struck south Florida in the waning days of the 1992 presidential campaign, it sent shock
          waves through the White House and emergency management policy subsystem that have not yet subsided.
          Wamsley and Schroeder analyze the causes and effects and conclude: (1) that politics of disasters
          are escalating and have become reliable props for the media, presidency, and political theatre
          at the same time that, (2) the policy subsystem is undergoing its most extensive changes since
          FEMA was formed, and (3) that a number of the pathologies of our political system are highlighted
          by the events."
        pages: May/June, pp. 235-244
      - title: To Politicize is Not to Control
        authors:
          - Wamsley, G.L.
          - "**Schroeder, A.D.**"
          - Lane, L.M.
        date: "1996-04-01"
        journal: The American Review of Public Administration
        url: https://www.researchgate.net/publication/238430496_To_Politicize_is_Not_to_Control_The_Pathologies_of_Control_in_Federal_Emergency_Management
        slug: politicize
        subcategory: Journal Publications (refereed)
        content:
          One of the most significant problems of bureaucracy in a democratic polity is how to achieve
          a tolerable coexistence between political and managerial control. When these aspects of control
          get out of balance, certain pathologies occur. This paper seeks to draw lessons from a study of
          the Federal Emergency Management Agency that show that the politicization of the administrative
          mechanisms of government, in the name of controlling bureaucracy and policy, has some effects
          that erode rather than enhance the capacity of democratic governance. These effects are in every
          way as serious as any threats posed to a democracy and the institutions of governance by a non-responsive
          bureaucracy or a bureaucracy that plays more than a role of mere implementation of policy made
          by others.
        pages: September, pp. 45-60
    Book Chapters:
      - title:
          "The Evolution of Emergency Management in America: From a Painful Past to a Promising but
          Uncertain Future"
        authors:
          - "**Schroeder, A.D.**"
          - Wamsley, G.L.
          - Ward, R.
        date: "2012-07-30"
        journal: Handbook of Emergency Management
        local_path: ../../../downloads/Schroeder_Evolution_of_Emergency_Management.pdf
        slug: em_evolution
        subcategory: Book Chapters
        content:
          This chapter traces the evolutionary maturation of emergency management in America. It
          has been a slow and torturous process of ‘‘coming of age,’’ made all the more difficult by the
          unique peculiarities of America’s democratized, constitutional, and federal republic and made
          more urgent by the implacable extension of our ‘‘built environment’’ into harm’s way. The chapter
          also shows that what is evolving in emergency management, more often than not unconsciously, is
          a ‘‘network entity,’’ similar in some respects to ‘‘network orga- nizations’’ that have developed
          in the private sector but different in other respects. It has the Federal Emergency Management
          Agency (FEMA) at its center but is a complex net- work with a distinctive political economy and
          a ‘‘network management process,’’ if we understand that ‘‘management’’ in this sense is something
          quite different from the com- mand-and-control characteristics usually connoted by the word. The
          chapter concludes with some questions concerning the future of emergency management, FEMA, and
          the network of which FEMA is the center.
        editors: "Ali Farazmand. Marcel-Dekker: New York"
