      - name: Public Administration & Policy Inquiry (Research Design & Statistics)
        date: "2013-05-22"
        content:
          "### Course Description\n<p>\n    PA and Policy Inquiry serves as the &quot;methods&quot;\
          \ course for the MPA curriculum.\n    However, unlike traditional methods course, this course\
          \ is aimed at those who\n    are or soon will be administrators, as opposed to those who wish\
          \ to be Social\n    Science Researchers. The course covers the same concepts, same designs, and\
          \ same\n    tools, but has a different focus. This course is focused on potential action and\n\
          \    decision making informed by analytical analysis. While the student will be able\n    to design\
          \ and understand research set up to provide causal explanation, this\n    will not be the main\
          \ focus.\n</p>\n\n### Learning Objectives\n\n<ul>\n    <li>Attain a good conceptual understanding\
          \ of &quot;statistical&quot; thinking.</li>\n    <li>Understand the tools of analytic decision\
          \ making.</li>\n    <li>Be able to understand&nbsp; and work with different types of research\
          \ designs.</li>\n    <li>Be able to use Microsoft Excel for basic statistical operations and analysis</li>\n\
          </ul>\n\n### Assignments:\n<ol>\n    <li>Statistical Forms of Logic Assignment</li>\n    <li>Indicators\
          \ of Excellence and Satisfaction Assignment</li>\n    <li>Frequency Distributions, Graphs and\
          \ Charts Assignment</li>\n    <li>Average, Deviation and Normal Curve Quiz</li>\n    <li>Contingency\
          \ Tables and Chi Square Quiz</li>\n    <li>Validity and Sampling Quiz</li>\n    <li>Statistical\
          \ Inference and Hypothesis Testing Quiz</li>\n    <li>Linear Regression Quiz</li>\n    <li>Research\
          \ Design Quiz</li>\n    <li>Final project - students design a study, conduct the study, analyze\
          \ the data and present to a\nclient organization</li>\n</ol>\n\n### Grading\n<ul>\n    <li>60%\
          \ assignments</li>\n    <li>20% final paper</li>\n    <li>10% final presentation</li>\n    <li>10%\
          \ class participation</li>\n</ul>\n\n### Required Materials\n* (Later in Semester) Statistical\
          \ Analysis with Excel for Dummies by Joseph\n    Schmuller\n\n### Course Sessions\n\n#### Introduction\
          \ to Inquiry and the Forms of Statistical Reasoning\n\n  <p>\n      Introduction of teacher and\
          \ students. Introduction to the purpose&nbsp;and focus of\n      the course. Introduction to Nine\
          \ Major Statistical Ideas.</p>\n  <ul>\n      <li><a href=\"/downloads/Policy Inquiry - Lecture\
          \ 1 - Forms of Statistical Logic.pptx\">Forms\n          of Statistical Logic</a></li>\n  </ul>\n\
          \n#### Categories, Classification, Measurements, and Scales\n\n##### Nominal, Ordinal, Interval,\
          \ Ratio\n\n  <ul>\n      <li><a href=\"/downloads/Policy Inquiry - Lecture 2 - Categorization,\
          \ Indexes & Scales.pptx\">\n          Categories, Classification, Measurement &amp; Scales</a></li>\n\
          \  </ul>\n\n### Descriptive Statistics - Textual and Graphical Representations\n\n  <p>\n    \
          \  Tables, Frequency Distributions, Percentage Frequency Distributions, Cummulative\n      Frequency\
          \ Distributions, Bar Graphs, Histographs, Line Graphs, Pie Charts</p>\n  <ul>\n      <li><a href=\"\
          /downloads/Policy Inquiry - Lecture 3 - Descriptive Statistics - Textual and Graphical.pptx\"\
          >\n          Descriptive Statistics: Textual &amp; Graphical</a></li>\n      <li><a href=\"//downloads/Contingency\
          \ Table Exercises.docx\">\n          Constructing Contingency Tables Exercises (pdf)</a></li>\n\
          \      <li><a href=\"/downloads/Lecture 5, Contingency Table Example - Automobile Maintence Data.doc\"\
          >\n          Contingency Table Example - Automobile Maintence Data</a></li>\n      <li><a href=\"\
          /downloads/Lecture 5, Contingency Table Example (Larger) - Income and Job Satisfaction.doc\">\n\
          \          Larger Contingency Table Example - Income and Job\n          Satisfaction</a></li>\n\
          \  </ul>\n\n### Descriptive Statistics - Numerical Representations\n\n  <p>\n      Mode, Median,\
          \ Arithmetic Mean, Weighted Average, Means and Medians from Grouped\n      Data</p>\n  <ul>\n\
          \      <li><a href=\"/downloads/Policy Inquiry - Lecture 4 - Descriptive Statistics - Numerical.pptx\"\
          >\n          Descriptive Statistics: Numerical</a></li>\n      <li><a href=\"/downloads/Lecture\
          \ 4, Medians from Grouped Data Example.pdf\">\n          Medians from Grouped Data (pdf)</a></li>\n\
          \  </ul>\n\n  <div>\n      <span class=\"title2\">Analysis of Nominal and Ordinal Data</span>\n\
          \  </div>\n  <p>\n      Construction and Analysis of Contingency Tables, Statistical Aids for\n\
          \      Interpretation, Control Table Analysis</p>\n  <ul>\n      <li><a href=\"/downloads/Policy\
          \ Inquiry - Lecture 5 - Analysis of Nominal and Ordinal Data.pptx\">\n          Analysis of Nominal\
          \ and Ordinal Data</a></li>\n      <li><a href=\"/downloads/Calculating%20Chi-Square.pdf\">Analysis\
          \ Nominal\n          Calculating Chi-Square (pdf)</a></li>\n  </ul>\n\n### Validity and Sampling\n\
          \n  <p>\n      Conclusion Validity, Internal Validity, Construct Validity, External Validity,\n\
          \      Sampling Error, Sampling Distribution, Probability Sampling, Non-Probability\n      Sampling</p>\n\
          \  <ul>\n      <li><a href=\"/downloads/Policy Inquiry - Lecture 6 - Validity, Inference and Sampling\
          \ - Instructor.pptx\">Validity Inference &amp; Sampling</a></li>\n\n  </ul>\n\n  <div>\n     \
          \ <span class=\"title2\">Hypothesis Testing and the t-Test</span>\n  </div>\n  <p>\n      Hypotheses\
          \ and Statistical Decision Making, Testing Hypotheses with Populations,\n      Testing Populations\
          \ with Samples</p>\n  <ul>\n      <li><a href=\"/downloads/Policy Inquiry - Lecture 7 - Hypothesis\
          \ Testing and the t-Test.pptx\">Hypothesis Testing and the t-Test</a></li>\n      <li><a href=\"\
          downloads/Policy Inquiry - Lecture 7 - Hypothesis Testing and z, t and chi.pptx\">Hypothesis Testing\
          \ and z, t and chi</a></li>\n      <li><a href=\"/downloads/Lecture 5, Alcoholism Third Variable.doc\"\
          >Alcoholism and Controlling for a Third Variable(pdf)</a></li>\n  </ul>\n\n### Linear Regression\n\
          \n  <p>\n      Linear Statistical Relationships, Standard Error of the Estimate, The\n      Coefficient\
          \ of Determination, The Standard Error of the Slope</p>\n\n  <ul>\n      <li><a href=\"/downloads/Policy\
          \ Inquiry - Lecture 8 - Linear Regression.pptx\">Linear Regression</a></li>\n      <li><a href=\"\
          /downloads/Regression Example - Beer Revenue.pdf\">Linear Regression Example - Beer Revenue</a></li>\n\
          \  </ul>\n\n### Research Design\n\n  <p>\n      Research Designs for Description, Research Designs\
          \ for Explanation</p>\n\n  <ul>\n    <li><a href=\"/downloads/Research Designs for Explanation.ppt\"\
          >Research Designs for Explanation</a></li>\n  </ul>\n\n### Draft Instrument Design\n\n  <p>Project\
          \ Team Meetings</p>\n\n  <div class=\"title2\">\n      Pilot Testing and Final Instrument Design\n\
          \  </div>\n  <p>Project Team Meetings</p>\n\n### Statistics in Excel\n\n  <p>Computer Lab - Data\
          \ Collection</p>\n\n  <div class=\"title2\">\n      Data Collection &amp; Analysis Draft\n  </div>\n\
          \  <p>Whole Class Meets - Report &amp; Presentation</p>\n\n### Presentation to Client\n\n<p>Final\
          \ Analysis Due</p>"
