          War II initiative led by Virginia Tech) (PI)
        content:
          Part of an open-access digital project funded by the National Endowment for the Humanities.
          Successfully applied a significant number of current data science approaches, including Advanced
          Data Wrangling, Natural Language Processing, Computational Text Analysis; Social Network Analysis,
          and Sentiment Analysis to make the WWII Soldiers’ remarkable collection of written reflections
          on war and military service available to scholars and the public, as well as provide some initial
