          \ and heuristic\n  evaluation) to successfully target fundamental usability problems and design\n\
          \  changes that should be made to improve the users experience on your website.</span></p>\n \
          \ <p><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>&nbsp;</span></p>\n  <p><span\
          \ style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Heuristic\n  evaluation is a usability\
          \ inspection method. Heuristic evaluation is done as\n  a systematic inspection of a user interface\
          \ design for usability. The goal of\n  heuristic evaluation is to find the usability problems\
          \ in the design so that\n  they can be attended to as part of an iterative design process. Heuristic\n\
          \  evaluation involves having a small set of evaluators examine the interface\n  and judge its\
          \ compliance with recognized usability principles (the\n  &quot;heuristics&quot;).</span></p>\n\
