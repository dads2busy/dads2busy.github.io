        date: "2020-01-01"
        journal: MethodSpace, SAGE Publishing
        url: https://researchmethodscommunity.sagepub.com/blog/open-source-the-future-of-software-innovation
      - title: "Doing Data Science: A Framework and Case Study"
        authors:
          - Keller, S. A.
          - Shipp, S. S.
          - "**Schroeder, A. D.**"
          - Korkmaz, G.
        date: "2020-03-01"
        journal: Harvard Data Science Review. 2(1).
        doi: 10.1162/99608f92.2d83f7f5
        slug: harvard_econ
        subcategory: Journal Publications (refereed)
        content:
          Today’s data revolution is not just about big data, it is about data of all sizes and types.
          While the issues of volume and velocity presented by the ingestion of massive amounts of data
          remain prevalent, it is the rapidly developing challenges being presented by the third v, variety,
          that necessitates more attention. The need for a comprehensive approach to discover, access, repurpose,
          and statistically integrate all the varieties of data is what has led us to the development of
          a data science framework that forms our foundation of doing data science. Unique features in this
          framework include problem identification, data discovery, data governance and ingestion, and ethics.
          A case study is used to illustrate the framework in action. We close with a discussion of the
          important role for data acumen.
      - title:
          "The Scope and Impact of Open Source Software as Intangible Capital: A Framework for Measurement
          with an Application Based on the Use of R Packages"
        authors:
          - Robbins, C.
          - Korkmaz, G.
          - Calderon, J. B. S.
          - Chen, D.
          - "**Schroeder, A.**"
          - Kelling, C.
          - "..."
          - Keller, S.
        date: "2019-04-30"
        journal: Big Data for 21st Century Economic Statistics. University of Chicago Press.
        slug: open_source_econ
        subcategory: Journal Publications (refereed)
        content:
          Open source software allows free access to digital tools and constitutes a part of intangible
          investment with the qualities of public goods. Open source software (OSS) provides users with
          an unknown amount of freely modifiable software tools and other useful products; they arecreated
          both within the business sector and outside of it.  Better accounting for the contribution of
          public spending to investments in OSS, a vital component of science activity, motivates this paper.  We
          develop a  bottom-up approach to document the scope and impact of OSS created by all sectors of
          the economy by collecting data on OSS languages R and Python, as well as from the Federal Government’s
          Code.gov.
      - title: Predicting postsecondary trajectories in Virginia high schools using publicly available data
        authors:
          - Pires, B.
          - Crandell, I.
          - Arnsbarger, M.
          - Lancaster, V.
          - "**Schroeder, A.**"
          - Shipp, S.
          - Kang, W.
          - Robinson, P.
          - Keller, S.
        date: "2018-12-10"
        journal: Statistical Journal of the IAOS, 34(4)
        doi: 10.3233/SJI-180455
        slug: predicting_post_secondary
        subcategory: Journal Publications (refereed)
        content:
          "Postsecondary educational attainment is an important determinant of future economic opportunity
          and social mobility. However, sizable gaps in educational attainment exist within communities
          and across sociodemographic lines. The goal of this research is to develop processes and methodologies
          that could be applied across a variety of geographic areas to better understand why postsecondary
          attainment varies across communities. Academic persistence is influenced by factors that go beyond
          the individual student, to include contextual and institutional influences. We developed a study
          of 21 high schools within two distinct geographic regions of Virginia: Richmond City and surrounding
          rural counties and the Roanoke and Appalachian region. We used nearly 70 publicly available administrative,
          survey, and opportunity datasets from across multiple organizations to characterize the high schools,
          the student body, and the communities. These data informed predictive models and statistical analysis
          for exploring factors that influence student outcomes after high school. We found that influencing
          factors varied by student characteristics (e.g., economically disadvantaged) and high school location
          (urban versus rural). We must account for the unique characteristics of the student and the communities
          to develop targeted strategies that encourage postsecondary enrollment."
        pages: 553-565
      - title:
          Record Linkage Reconciliation of Arlington Department of Human Services Administrative Data
          Using Potts Models
        authors:
          - Crandell, I.
          - "**Schroeder, A.**"
          - Higdon, D.
          - Irwin, M. D.
        date: "2018-10-11"
        journal: International Journal of Population Data Science, 3(5)
        doi: 10.23889/ijpds.v3i5.1061
        slug: potts_model
        subcategory: Journal Publications (refereed)
        content:
          Situated at the nexus of federal, state, and local governments, the Arlington Department
          of Human Services (DHS) receives service utilization data from a multitude of different sources.
          Because of their “no wrong door” policy, customers can sign up for any DHS service from any DHS
          department. A practical consequence of this is that a single person can appear as multiple records
          from multiple databases with no unambiguous key between these records. Merging these records requires
          a probabilistic linkage approach. Classical approaches to record linkage, such as the method of
          Felligi and Sunter, consider each possible pair of records between databases and assigning link
          probabilities to each one. A drawback of considering pairwise links alone is that sometimes the
          transitive nature of links is violated. In order to better handle such information clashes, we
          propose a Bayesian linkage method that considers a large set of possible pairs at once. At the
          heart of this approach is a Potts model representation that tracks which records are assigned
          to the same individual. This allows us to assign probabilities to the various reconciliations
          of inconsistent linkage assignments.
      - title: Harnessing the power of data to support community‐based research
        authors:
          - Keller, S.
          - Shipp, S.
          - Korkmaz, G.
          - Molfino, E.
          - Goldstein, J.
          - Lancaster, V.
          - "..."
          - "**Schroeder, A.**"
        date: "2018-05-10"
        journal: "Wiley Interdisciplinary Reviews: Computational Statistics, 10(3), e1426"
        url: https://ijpds.org/article/view/1061
        slug: harnessing
        subcategory: Journal Publications (refereed)
        content:
          "Volumes of data are generated at every moment as we go through the paces of our daily
          lives. Many of these data flows are routinely captured through administrative records, social
          media, and surveys. Historically, agencies at different levels of government have been responsible
          for curating and reporting statistics about our social, economic, and health conditions associated
          with these data flows. Recently, the U.S. government has proposed the use of data derived from
          administrative records at the federal level to support social policy and program evaluation. Why
          not consider parallel activities at state and local levels? Harnessing local data sources and
          integrating them with state and federal sources will provide timelier and more geographically
          specific analyses to support local insights and policy development. Leveraging community‐based
          participatory research, researchers and civic leaders can work together to identify the questions
          and execute rigorous, yet flexible, processes for building local sustainable community learning
          cultures based on data‐driven discovery. In the process of conducting research with local civic
          leaders, we have observed that issues can be classified into 3 categories: locating and describing
          a population within a community; estimating a statistic and a measure of variability; and evaluating
          a program, policy, or procedure. Through a series of case studies, this paper demonstrates the
          unexpected value in liberating and repurposing local data."
      - title:
          "Estimating individualized exposure impacts from ambient ozone levels: A synthetic information
          approach"
        authors:
          - Pires, B.
          - Korkmaz, G.
          - Ensor, K.
          - Higdon, D.
          - Keller, S.
          - Lewis, B.
          - "**Schroeder, A.**"
        date: "2018-03-15"
        journal: Environmental Modelling & Software. Volume 103, May 2018, Pages 146–157
        doi: 10.1016/j.envsoft.2018.02.007
        slug: ozone
        subcategory: Journal Publications (refereed)
        content:
          There is ample evidence that short-term ozone exposure is associated with increased respiratory
          symptoms. Many studies, however, aggregate the population, activities, or concentration levels
          of the pollutant across space and/or time, failing to capture critical variations in the exposure
          levels. We couple spatiotemporal air quality estimates of ozone with a synthetic information model
          of the Houston Metropolitan Area, allowing us to attach exposure levels to individuals based on
          exact times, geo-locations, and microenvironments of activities. Several scenarios of the model
          are run at different levels of resolution. When we maintain the spatiotemporal resolution of the
          data, the proportion of the population that experiences sharp increases in short-term exposure
          increases substantially. This can be particularly important if experienced by sensitive populations
          given the increased risk for adverse health effects. We find that individuals in the same zip
          code, neighborhood, and even household have varying levels of exposure.
      - title: Can Administrative Housing Data Replace Survey Data?
        authors:
          - Molfino, E.
          - Korkmaz, G.
          - Keller, S. A.
          - "**Schroeder, A.**"
          - Shipp, S.
        date: "2017-04-16"
        journal: Cityscape, 18(4)
        url: https://www.jstor.org/stable/26328312?seq=1
        slug: admin-housing-data
        subcategory: Journal Publications (refereed)
        content:
          "This article examines the feasibility of using local administrative data sources for enhancing
          and supplementing federally collected survey data to describe housing in Arlington County, Virginia.
          Using real estate assessment data and the American Community Survey (ACS) from 2009 to 2013, we
          compare housing estimates for six characteristics: number of housing units, type of housing unit,
          year built, number of bedrooms, housing value, and real estate taxes paid. The findings show that
          housing administrative data can be repurposed to enhance and supplement the ACS, but limitations
          exist. We then discuss the challenges of repurposing housing administrative data for research."
      - title:
          "The Evolution of Data Quality: Understanding the Transdisciplinary Origins of Data Quality
          Concepts and Approaches"
        authors:
          - Keller, S.A.
          - Korkmaz, G.
          - Orr, M.
          - "**Schroeder, A.**"
          - Shipp, S.
        date: "2017-03-01"
        journal: Annual Review of Statistics and Its Application, 4(1)
        doi: 10.1146/annurev-statistics-060116-054114
        slug: data_quality_hist
        subcategory: Journal Publications (refereed)
        content:
          Data, and hence data quality, transcends all boundaries of science, commerce, engineering,
          and policy. Data quality has historically been addressed by controlling the measurement processes,
          controlling the data collection processes, and through data ownership. For many data sources being
          leveraged into data science, this approach to data quality may be challenged. To understand that
          challenge, an historical and disciplinary perspective on data quality, highlighting the evolution
          and convergence of data concepts and applications is presented.
      - title: Does Big Data Change the Privacy Landscape? A Review of the Issues
        authors:
          - Keller, S. A.
          - Shipp, S.
          - "**Schroeder, A.**"
        date: "2016-11-01"
        journal: Annual Review of Statistics and Its Application, 3(1)
        slug: privacy_landscape
        subcategory: Journal Publications (refereed)
        content:
          The current data revolution is changing the conduct of social science research as increasing
          amounts of digital and administrative data become accessible for use. This new data landscape
          has created significant tension around data privacy and confidentiality. The risk-utility theory
          and models underpinning statistical disclosure limitation may be too restrictive for providing
          data confidentially with the growing volumes and varieties of data and the evolving privacy policies.
          Science and society need to move to a trust-based approach where both researchers and participants
          benefit. This paper discusses the explosive growth of the new data sources and the parallel evolution
          of privacy policy and governance, with a focus on access to data for research. A history of privacy
          policy, statistical disclosure limitation research, and record linkage in the context of this
          “brave new world” of data is provided.
      - title: Towards an in silico Experimental Platform for Air Quality - Houston, TX as a Case Study.
        authors:
          - Pires, B.
          - Korkmaz, G.
          - Ensor, K.
          - Higdon, D.
          - Keller, S. A.
          - "**Schroeder**"
        date: "2015-11-05"
        journal: Computational Social Science Society of America Conference. Santa Fe, New Mexico.
        slug: in-silico-air-quality
        subcategory: Journal Publications (refereed)
        content:
          In this paper we couple a spatiotemporal air quality modelof ozone concentration levels
          with the synthetic information model of theHouston Metropolitan Area. While traditional approaches
          often aggre-gate the population, activities, or concentration levels of the pollutantacross  space  and/or  time,  we  utilize  high  performance  computing  andstatistical
          learning tools to maintain the granularity of the data, allow-ing us to attach specific exposure
          levels to the synthetic individuals basedon the exact time of day and geolocation of the activity.
          We demonstratethat maintaining the granularity of the data is critical to more accuratelyreflect
          the heterogeneous exposure levels of the population across timewithin the greater Houston area.
          We find that individuals in the samezip code, neighborhood, block, and even household have varying
          levelsof exposure depending on their activity patterns throughout the day.
        ordinal: "6"
      - title: "Pad and Chaff: Secure Approximate String Matching in Private Record Linkage"
        authors:
          - "**Schroeder, A.D.**"
        date: "2012-05-28"
        journal:
          Proceedings of the 14th International Conference on Information Integration and Web-based
          Applications and Services (iiWAS '12)
        doi: 10.1145/2428736.2428757
        slug: pad_and_chaff
        subcategory: Journal Publications (refereed)
        content:
          The promise of high-quality, integrated data sets for policy analysis is great. However,
          significant impediments remain that make the creation of such data sets very difficult. The identification
          of processes and algorithms for carrying out approximate string matching on personal-level information
          while at the same time keeping that information unknown (private linkage) is quickly growing in
          importance. Without these processes and algorithms, the creation of high-quality data sets integrated
          from multiple public agencies remains difficult. In this paper, a method for carrying out secure,
          private string-matching between data sets using standard string similarity measures is presented.
        editors: ACM, New York, NY, USA
        pages: pp. 121-125
