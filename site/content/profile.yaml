      - title:
          "Census Curated Data Enterprise Use Case Demonstration: Climate Resiliency of Skilled Nursing
          Facilities"
        authors:
          - Lancaster V
          - Shipp S
          - Keller S
          - "**Schroeder A**"
          - Mortveit H
          - Swarup S
          - Xie D
        date: "2023-01-01"
        journal:
          Proceedings of the Biocomplexity Institute, Technical Report. TR# 2023-53. University of
          Virginia.
        doi: 10.18130/ce97-sp05
        slug: census_curated_data_enterprise
        subcategory: Research/Technical Reports
        content:
          "The proposed Curated Data Enterprise (CDE) is a transformative approach for how the Census
          Bureau could accomplish its mission to develop and provide high-quality, timely, and geographically
          detailed statistical products by changing how it manages its data assets, incorporates information
          from external sources, and leverages them for the public good. The CDE explicitly focuses on curating
          not only the data that are part of the enterprise but also all of the processes associated with
          creating a statistical product, including the relevant context, and ingesting, analyzing, and
          producing purpose-driven statistical products on platforms that permit wide accessibility. The
          CDE would move the Census Bureau into a position to meet the challenges confronting statistical
          agencies in the 21st Century (Keller et al., 2022).


          This report demonstrates the CDE concept through a Use Case on Skilled Nursing Facilities (Shipp,
          Salvo, & Zhang, 2022). We implemented this Use Case to begin to highlight the capabilities needed
          to develop and deploy the proposed CDE successfully. Lessons learned through the development will
          inform the design of a Use Case Research Program to test and implement the CDE concept use case
          by use case. It is imperative that this be done by posing relevant questions and building data
          insights that will inform the public and stakeholders and provide a platform for future research."
