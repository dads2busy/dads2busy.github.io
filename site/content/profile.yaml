      - name: Virginia Early Childhood Professional Registry
        date: 2010-2016
        award: $110,840
        summary: Virginia Department of Social Services — $110,840 (PI)
        url: http://registry.fivehokies.com/
        content:
          The creation of an early childhood education workforce personnel and training registry
          system for the Commonwealth of Virginia is necessary for two reasons—to provide the most complete
          and best understanding of the day care environment a child has experienced in concert with the
          child and provider data, and to establish a professional development tracking system for child
          care professionals. The relationship between practitioner level of education and types and level
          of training and impact on child outcomes, for example, can be accurately assessed. To build this
          system, practitioner, trainer and training core data elements will be adapted to existing standards
          and translated to a normalized relational structure to allow for accurate analysis and reporting.
          Additionally, the data system will incorporate linkages to existing data sources that already
          provide the needed core data elements. The resulting functional database system will be accessed
          through a web-based interface for both administrative management and participant interaction.
        slug: registry
        subcategory: Data Integration & Management
        ordinal: "5"
      - name:
          "Child HANDS: Building Child and Family Policy Research Data Capacity for the Commonwealth
          of Virginia: An Integrated Model"
        date: 2008-2011
        summary:
          Administration for Children & Families (US Department of Health & Human Services) — $650,000
          (PI)
        url: http://www.childhands.net/
        content:
          "Using a federated data approach to multi-agency data integration, the central aim of Project
          Child HANDS (Child Care Subsidy, Health and Early Education: Helping Analyze Needed Data Securely)
          is to build an integrated, web-based data system for Virginia childhood initiatives aimed at low-income
          families, to guide program evaluation and policy decisions at the state and local levels. Data
          from agencies at local levels will provide the main source of information for use in local planning,
          as well as state evaluation of large-scale programs. Partners in the grant include the Virginia
          Department of Social Services and the Virginia Department of Education, with input from the Virginia
          Department of Health. Initial questions will focus on child care quality in relation to the child
          care subsidy program, family demographics, parental choice, and how these factors relate to children’s
          outcomes in kindergarten. Later questions will expand into other areas of child welfare and health."
        slug: hands
        subcategory: Data Integration & Management
        ordinal: "3"
