  sections:
    Summary:
      - Dr. Schroeder's overarching research focus is the enablement of Evidence-Based Policy-Making and
        Program Evaluation through the secure liberation, integration and analysis of administrative data.
      - A particular focus has been the integration of education, health, social service and non-profit
        administrative data streams to support policy analyses and program evaluations across pre-K services,
        child care, K-12 and adult education, state workforce training, and U.S. veteran services.
      - High-profile information integration projects in the Commonwealth of Virginia include the USED-funded
        Statewide Longitudinal Data System, the USHHS-funded Project Child HANDS, and the USDOT-funded design
        and evaluation of the U.S.'s first statewide travel information system, Virginia 511.
