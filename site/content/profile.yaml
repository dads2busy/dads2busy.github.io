    Teaching:
      - name: Administrative Data Systems & Technologies
        date: "2013-05-22"
        content:
          "<p><u><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Purpose\nof Class</span></u><span\
          \ style='font-size:12.0pt;font-family:\"Arial Narrow\"'>: To\nintroduce Master's-level CPAP students\
          \ to some of the systems and technologies\nthey are likely to encounter in today's governmental\
          \ agencies. In addition to\nunderstanding what they are, the purpose of this course is to provide\
          \ hands-on\nexposure to these systems and technologies.</span></p>\n\n<p><span style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'>&nbsp;</span></p>\n\n<p><u><span style='font-size:12.0pt;font-family:\"Arial Narrow\"\
          '>Class\nProject</span></u><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>: So\n\
          that the systems and technologies considered in this course are not considered\nisolated and un-related\
          \ to each other, an over-riding project that involves the\nuse of every technology introduced\
          \ will be employed. The project to be used this\nsemester is the building of the first e-government\
          \ web-presence for a rural </span><span\n  style='font-size:12.0pt;font-family:\"Arial Narrow\"\
          '>Virginia</span><span\nstyle='font-size:12.0pt;font-family:\"Arial Narrow\"'> county, Craig county.\
          \ This\nproject will not only entail having to deal with actual public administrators,\nbut will\
          \ result in the production of an actual product to be used by the\ncitizenry of that county.</span></p>\n\
          \n<p><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>&nbsp;</span></p>\n\n<p><u><span\
          \ style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Project\nTeams</span></u><span style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'>: Craig\ncounty government can be divided into 6 distinct units: County administration;\n\
          Treasurer; Commissioner of the Revenue; Clerk of the Court; Commonwealth's\nAttorney; and the\
          \ </span><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>County</span><span\n style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'> </span><span\n  style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Sheriff</span><span\n\
          style='font-size:12.0pt;font-family:\"Arial Narrow\"'>. Accordingly, the class\nwill be separated\
          \ into six teams, each focused specifically on creating a\nweb-presence for its assigned unit\
          \ of government. If the size of the class is\nsignificantly larger than planned, additional governmental\
          \ units may be added.</span></p>\n\n<p><span style='font-size:12.0pt;font-family:\"Arial Narrow\"\
          '>&nbsp;</span></p>\n\n<p><u><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Grading</span></u><span\n\
          style='font-size:12.0pt;font-family:\"Arial Narrow\"'>:</span></p>\n\n<p><span style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'>The\nfinal grade in the course comes from the addition of five separate components</span></p>\n\
          \n<ul style=\"margin-top:0in\" type=\"square\">\n <li><span style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'>Instructor\n     individual rating: 15% -- how much effort does the instructor\
          \ think the\n     individual contributed to the team on group assignments</span></li>\n <li><span\
          \ style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Intra-group\n     rating: 20% -- how much\
          \ effort does each team member think the other\n     members of his/her team put into the project</span></li>\n\
          \ <li><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Inter-group\n     rating: 15%\
          \ -- according to each group, which of the other groups put the\n     most effort into their project</span></li>\n\
          \ <li><span style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Skills\n     quizzes: 25% --\
          \ are you learning the technical skills that are being\n     presented?</span></li>\n <li><span\
          \ style='font-size:12.0pt;font-family:\"Arial Narrow\"'>Assignments:\n     25% -- are team assignments\
          \ being completed on time?</span></li>\n</ul>\n\n<p><span style='font-size:12.0pt;font-family:\"\
          Arial Narrow\"'>&nbsp;</span></p>\n\n<p><span style='font-size:12.0pt;font-family:\"Arial Narrow\"\
          '>&nbsp;</span></p>\n\n<table border=\"1\" cellspacing=\"0\" cellpadding=\"0\" style=\"border-collapse:collapse;border:none\"\
          >\n <tr style='page-break-inside:avoid'>\n  <td valign=\"top\" style='border:solid windowtext\
          \ 1.0pt;\n  padding:0in 5.4pt 0in 5.4pt'>\n  <p align=\"center\" style='text-align:center'><b><span\n\
