          <p class="P2">Course Description</p><p class="Standard"><span class="T6">The worlds of Policy
          Analysis and Program Evaluation, while overlapping and sharing similarities in terms of general
          logical approach, are quite different in their level of focus, level of detail, and overall purpose.  While
          the person put in charge of evaluating the success of a particular government program will be
          necessarily focused on whether or not predicted outcomes have been achieved or processes of delivery
          have been adequately established, the policy analyst will generally be more concerned with understanding
          the political and economic issues involved with the passage of a policy (which could affect many
          different programs) and how those issues will or will not make it possible to adjust the existing
          or create a new policy. Accordingly, this course will have two tracks, one focusing on the approaches
          and methods of Program Evaluation, the other on the approaches and methods of Policy Analysis.</span></p><p
          class="P4"> </p><p class="P2">Program Evaluation vs. Policy Analysis</p><p class="Standard"><span
          class="T6">While the course is attended by both MPA and PhD students, it is most heavily populated
          by MPA students. Therefore, the focus on Program Evaluation will be stressed to a greater extent.
          Fortunately, most of the information about approaches and methods of Program Evaluation is quite
          relevant and useful to the budding policy analyst and/or professor of public administration. In
          terms of Program Evaluation, this course will be reviewing the many approaches to conducting an
          evaluation (e.g. objectives-oriented vs. management-oriented) as well as the many designs that
          may be adopted (e.g. case studies vs. pretest-posttest vs. regression-discontinuity).</span></p><p
          class="P4"> </p><p class="P2">Tools of the Trade</p><p class="Standard"><span class="T6">What
          the Policy Analyst and the Program Evaluator do share is a need to understand the tools at their
          disposal for collecting the necessary information of their trade. Because the trade of government
          (either policy making or program implementation) is conducted by people and for people, the information
          collection tools used by the Policy Analyst and Program Evaluator are necessarily comprised of
          methods of soliciting information from people (from one person, a small group of people, or a
          large population of individuals). Therefore, one of the main foci of this course will be learning
          about the "tools of the trade" for eliciting information from populations, small groups, and individuals.
          Specifically, the students of this course will learn about Survey Design, Running a Focus Group,
          and Conducting Interviews (of multiple types).</span></p><p class="P4"> </p><p class="P2">Workshops
          and Practitioner Presentations</p><p class="Standard"><span class="T6">There is no better way
          to learn about a profession than to see someone in that profession in action! Second best is to
          hear them talk about it...so, to better demonstrate some of the concepts being discussed in the
          class, a number of </span><span class="T7">"hands-on"</span><span class="T6"> </span><span class="T7">workshops</span><span
          class="T6"> and </span><span class="T7">practitioner</span><span class="T6"> </span><span class="T7">presentations</span><span
          class="T6"> have been scheduled. Each workshop or presentation is being led by a practicing professional
          in the field of policy analysis and/or program evaluation. Two hands-on workshops are being presented
          on the topics of Designing Surveys and Leading Focus Groups. The survey design workshop is being
          directed by Dr. Steven Culver, the Asst. Director of Virginia Tech Office of Academic Assessment.
          The focus group workshop is being directed by research project manager Stephanie Baker of the
          Virginia Tech Transportation Institute. In addition, three practitioner presentations are being
          held. The first presentation is being given Mark Gribbin, a Senior Associate Legislative Analyst
          working for the Virginia State Joint Legislative Audit and Review Commission (JLARC) on the commission''s
          evaluation approach. Also, Mark will also be hosting a JLARC recruiting event during his visit.
          The second presentation is being given by Mary Beth Dunkenberger, the Senior Program Director
          at The Virginia Tech Institute for Policy and Governance (IPG) on the evaluation work of the institute.
          The final presentation is being given by Owen Perkins, a new junior researcher at IPG on a cost
          effectiveness analysis he is currently undertaking.</span></p><p class="P4"> </p><p class="P7">MPA
          Student Requirements</p><p class="P3">Quizzes</p><p class="P8"><span class="T6">MPA students will
          be responsible for taking 6 subject quizzes: Evaluation Approaches, Survey Design, Focus Groups,
          Interviewing Techniques, Evaluation Design, and Policy Analysis. Each quiz will be completed following
          discussion of the subject in class.</span></p><p class="P5"/><p class="P5">Quizzes count for 50%
          of your final grade.</p><p class="P5"> </p><p class="P3">Case Studies</p><p class="Standard"><span
          class="T6">Most of the approaches to evaluation, data collection tools, and evaluation design
          types will be demonstrated in use by a case study. Each MPA student will be required to present
          two (2) articles that illustrate the use of an approach, tool, or design under discussion. The
          presentation will be a 10 minute minimum PowerPoint presentation. A template for the format of
          the presentation will be on the web site. All case study articles will be available via the web
          site. Assignments will be made randomly. In addition, each student will create for distribution
          during the presentation a one-page "brief" explaining the approach, tool, or design discussed.
          These briefs will be converted in to pdf format and made available via the web site for use by
          class students in designing their project evaluations. At the end of the semester, the pdfs will
          be combined to form a single volume for download. The intent is that every student will be able
          leave the class with their own "workbook" of evaluation approaches, tools, and designs.</span></p><p
          class="P4"> </p><p class="Standard"><span class="T6">Case study presentations count for 20% of
          your final grade.</span></p><p class="P2"> </p><p class="Standard"><span class="T5">Evaluation/Research
          Mini-Project</span></p><p class="Standard"><span class="T6">Each student will be responsible for
          completing a small evaluation/research project by the end of the semester. In the fall semester,
          students in the Research Methods course were given a set of questions that the town manager of
          Blacksburg would like to have answered about different services in and around the town. The students
          then devised simple research plans to find answers for the town manager. For example, one question
          concerned what types of development ideas citizens would find appropriate for the old Blacksburg
          Middle School property. Working from a hypothesis that Blacksburg citizens would accept an alternative
          use for the property (other than leaving it as it is), a student proposed conducting a focus group
          to develop a survey to be distributed to an adequate sample size in and around Blacksburg. Some
          students devised quick approaches to other questions they had a personal interest in.</span></p><p
          class="P4"> </p><p class="Standard"><span class="T6">While these small research projects do not
          constitute on their own a program evaluation, they will give the MPA student the opportunity to
          apply some of the tools being discussed (e.g. stakeholder analysis, interviewing, focus groups,
          surveys, possibly applying a specific design). In addition, completion of the project will give
          the student the opportunity to interact with local government officials on real life topics. At
          the end of the semester these projects will be presented to the </span><span class="T7">Blacksburg
          Town Manager</span><span class="T6"> and, possibly, other town officials.</span></p><p class="P6"><span
          style="position:absolute;left:7.5189cm;"/></p><p class="P4">If you did not take the research methods
          course in the fall you will need to select one of the existing topics or discuss with me a different
          question to answer. A list of the questions supplied by the town manager will be available on
          the web site.</p><p class="P4"> </p><p class="P4">The Mini-project presentation counts for 20%
          of your final grade.</p><p class="P4"> </p><p class="P2">Class Participation</p><p class="Standard"><span
          class="T6">Each student is expected to have familiarized themselves with the case studies being
          presented so that they can ask pertinent questions of the case study presenter. The instructor
          will track the number of pertinent questions asked of presenters per student. This number, in
          addition to general level of participation, will be used to calculate a final class participation
          score.</span></p><p class="P4"> </p><p class="Standard"><span class="T6">Class participation counts
          for 10% of your final grade.</span></p><p class="P4"> </p><p class="Standard"><span class="T7">PhD
          Student Requirements</span></p><p class="P3">Quizzes</p><p class="P8"><span class="T6">PhD students
          will be responsible for taking 5 subject quizzes: Evaluation Approaches, Survey Design, Focus
          Groups, Interviewing Techniques, and Evaluation Design. Each quiz will be completed following
          discussion of the subject in class.</span></p><p class="P5"> </p><p class="P5">Quizzes count for
          30% of your final grade.</p><p class="P3"> </p><p class="P3">Case Studies</p><p class="Standard"><span
          class="T6">Most of the approaches to evaluation, data collection tools, and evaluation design
          types will be demonstrated in use by a case study. Each PhD student will be required to present
          one (1) article that illustrates the use of an approach, tool, or design under </span><span class="T6">discussion.
          The presentation will be a 10 minute minimum PowerPoint presentation. A template for the format
          of the presentation will be on the web site. All case study articles will be available via the
          web site. Assignments will be made randomly. In addition, each student will create for distribution
          during the presentation a one-page "brief" explaining the approach, tool, or design discussed.
          These briefs will be converted in to pdf format and made available via the web site for use by
          class students in designing their project evaluations. At the end of the semester, the pdfs will
          be combined to form a single volume for download. The intent is that every student will be able
          leave the class with their own "workbook" of evaluation approaches, tools, and designs.</span></p><p
          class="P4"> </p><p class="Standard"><span class="T6">The case study presentation counts for 10%
          of your final grade.</span></p><p class="P4"> </p><p class="P2">Teaching</p><p class="P4">PhD
          students graduating from CPAP most often end up working as professors of public administration
          or working in high level policy analyst positions at all levels of government. Therefore, there
          is a need by CPAP PhD graduates to be able to both understand policy decisions at a high conceptual
          level and be able to present those ideas in a clear, thoughtful, and interesting manner. These
          ideas could be conveyed to a classroom of public administration graduate students or to a room
          full of political staffers and, possibly, their political bosses. In either case, the public administration
          PhD student needs to learn to TEACH!</p><p class="P4"> </p><p class="Standard"><span class="T6">Accordingly,
          each PhD student in the class will be tasked with two teaching presentations. The first presentation
          will teach the rest of the class about one type of policy analysis framework (how they go about
          their work) and the second presentation will teach the rest of the class about one theory of knowledge
          (what is accepted as evidence/truth). Each presentation will use PowerPoint and will last approximately
          30 minutes. Additional materials may be used and distributed as necessary. For the benefit of
          the presenters, the presentations will be evaluated by the MPA students according to criteria
          derived earlier in the class (these evaluations are for learning purposes only and will not be
          used by the instructor in final grading).</span></p><p class="P4"> </p><p class="P4">Upon completion
          of the Policy Analysis presentations, the PhD students will be responsible for devising a 10-12
          question policy analysis quiz derived from information given in the presentations. The quiz will
          be administered to the MPA students via Blackboard for a grade.</p><p class="P4"> </p><p class="Standard"><span
          class="T6">The teaching presentations count for 25% of your final grade.</span></p><p class="P4">
          </p><p class="P2">Policy Analysis Proposal</p><p class="Standard"><span class="T6">The final assignment
          for the PhD student will be a policy analysis proposal. The student will be responsible early
          in the semester for identifying a policy area in which they have an interest. After completing
          the policy presentations, the student will be responsible for developing a five-page minimum length
          proposal to investigate some aspect of the selected policy area. The proposal will discuss the
          political and economic context of the policy area, the stakeholders to be considered in the analysis,
          the framework and epistemological stance from which the analyst will operate, and the approach
          and methods that will be used to conduct the analysis (as there are too many approaches and methods
          to be covered in this one class, it is not necessary that you only stick to those discussed).</span></p><p
          class="P4"> </p><p class="Standard"><span class="T6">The policy analysis proposal counts for 25%
          of your final grade.</span></p><p class="P4"> </p><p class="P2">Class Participation</p><p class="Standard"><span
          class="T6">Each student is expected to have familiarized themselves with the case studies being
          presented so that they can ask pertinent questions of the case study presenter. The instructor
          will track the number of pertinent questions asked of presenters per student. This number, in
          addition to general level of participation, will be used to calculate a final class participation
          score.</span></p><p class="P4"> </p><p class="P4">Class participation counts for 10% of your final
          grade.</p><p class="P4"> </p><p class="P32"> </p><table border="0" cellspacing="0" cellpadding="0"
