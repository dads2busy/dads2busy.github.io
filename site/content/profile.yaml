    Research Projects:
      - name: Leveraging Large Language Models to Identify Green Innovation
        date: 2023-2024
        summary: National Center for Science and Engineering Statistics (NSF) — $101,000 (PI)
        slug: green_ai
        subcategory: Data Integration & Management
        content: >-
          Focuses on supplementing the Annual Business Survey with Large Language Models to
          produce additional data on the development of green products in the United States.
          Builds on previous work using Natural Language Processing and Machine Learning to
          create supplemental indicators of innovation to existing survey statistics.
      - name: Developing Predictive Models of U.S. Army Career Pathways
        date: 2021-2025
        summary: U.S. Army Research Institute for the Behavioral and Social Sciences — $813,848 (years 4–5) (PI)
        slug: army_pathways
        subcategory: Program Evaluation/Policy Analysis
        content: >-
          Identifies and develops data and statistical tools (scalable to large datasets) to
          (a) identify different classes or dimensions of career profiles representing different
          career trajectories or patterns, and (b) develop predictive models of individual career
          trajectories, integrating data on individuals, units, and contextual/environmental factors.
          Models are developed and validated using archival Army data and compared to existing
          methods for modeling career dynamics.
      - name: The Social Component of the Human Dimension - Leveraging Existing DoD Data Towards Optimized Individual and Team Performance in the Army
        date: 2017-2022
        summary: Army Research Institute — $3,000,000 (Senior Personnel)
        slug: army_constructs
        subcategory: Program Evaluation/Policy Analysis
        content: >-
          Primary objective is to define and quantify the social component constructs of the
          Human Dimension and to use these as predictor constructs to describe and model Soldier
          and Team/Unit performance.
      - name: Use Statistical and Survey Methodology Research to Improve or Redesign Surveys
        date: 2017-2021
        summary: United States Department of Agriculture / National Science Foundation — $2,500,000 (Senior Personnel / Founding Co-PI)
        slug: stat_surveys
        subcategory: Data Integration & Management
        content: >-
          Explores and applies "Big Data" analytics for enhancement, improvement, or redesign of
          current surveys. Focus areas include identifying and collecting naturally occurring
          non-statistically designed data, assessing data quality of alternative sources, capturing
          new data sources and creating new measures, and advancing data collection methodologies
          beyond traditional survey collections including opportunity data with spatial or temporal design.
      - name: Towards an Integrated Data Framework for Understanding the Context of Military Environments
        date: 2015-2018
        summary: Army Research Institute — $1,691,337 (Co-PI)
        slug: dod_data
        subcategory: Data Integration & Management
        content: >-
          Assesses best approaches for successfully accessing and integrating DOD data and other
          data sources to expand the types of questions the data might inform, in particular the
          study of important recurring military issues. Assessment conducted within the context of
          a case study on military attrition, with a focus on the Army.
