<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <g fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- Desk surface -->
    <path d="M8 168 L252 168 L252 184 L8 184 Z" fill="#d9a55a"/>
    <line x1="8" y1="168" x2="252" y2="168" stroke="#b9863f"/>

    <!-- Paper sheet (slightly tilted) -->
    <g transform="rotate(-6 165 145)">
      <rect x="120" y="108" width="120" height="74" rx="3" fill="#ffffff"/>
      <line x1="132" y1="124" x2="226" y2="124" stroke="#cfcfcf" stroke-width="2"/>
      <line x1="132" y1="138" x2="226" y2="138" stroke="#cfcfcf" stroke-width="2"/>
      <line x1="132" y1="152" x2="226" y2="152" stroke="#cfcfcf" stroke-width="2"/>
      <line x1="132" y1="166" x2="196" y2="166" stroke="#cfcfcf" stroke-width="2"/>
    </g>

    <!-- Hair (back) -->
    <path d="M44 70 Q40 30 78 26 Q118 22 120 58 Q121 74 112 84 L108 60 Q92 50 74 54 Q58 58 56 78 Z" fill="#e8631f"/>

    <!-- Head / face -->
    <ellipse cx="82" cy="74" rx="33" ry="35" fill="#ffd2a6"/>

    <!-- Ear -->
    <circle cx="51" cy="80" r="7" fill="#ffd2a6"/>

    <!-- Hair (front fringe over forehead) -->
    <path d="M53 58 Q60 38 86 40 Q112 42 112 62 Q98 50 80 52 Q64 54 60 66 Z" fill="#e8631f"/>

    <!-- Rosy cheek -->
    <circle cx="70" cy="86" r="9" fill="#f4a3a3" stroke="none"/>

    <!-- Eye -->
    <circle cx="88" cy="74" r="3.5" fill="#1a1a1a" stroke="none"/>
    <!-- Eyebrow -->
    <path d="M80 64 Q88 60 96 64" stroke-width="2.5"/>
    <!-- Nose -->
    <path d="M100 78 Q106 82 100 86" stroke-width="2.5"/>
    <!-- Mouth (slight smile) -->
    <path d="M86 96 Q94 102 102 95" stroke-width="2.5"/>

    <!-- Neck -->
    <path d="M74 104 L74 116 L96 116 L96 100" fill="#ffd2a6"/>

    <!-- Shirt / torso (green), leaning toward desk -->
    <path d="M50 168 Q44 128 80 116 L96 116 Q150 124 176 150 L182 168 Z" fill="#3aa83a"/>

    <!-- Sleeve cuff -->
    <path d="M168 142 Q178 148 182 160" stroke-width="2.5" fill="none"/>

    <!-- Forearm + hand reaching to pencil -->
    <path d="M150 150 Q172 150 186 160 Q176 168 162 164 Q152 160 150 150 Z" fill="#ffd2a6"/>

    <!-- Pencil (pointing down-left to the paper) -->
    <g transform="rotate(38 176 158)">
      <!-- body -->
      <rect x="170" y="96" width="12" height="56" fill="#f4c20d"/>
      <!-- ferrule -->
      <rect x="170" y="86" width="12" height="10" fill="#c9c9c9"/>
      <!-- eraser -->
      <rect x="170" y="78" width="12" height="9" rx="2" fill="#f29ab0"/>
      <!-- wood tip -->
      <path d="M170 152 L182 152 L176 166 Z" fill="#e8c08a"/>
      <!-- lead -->
      <path d="M174 161 L178 161 L176 167 Z" fill="#1a1a1a" stroke="none"/>
    </g>

    <!-- Pencil stroke on paper -->
    <path d="M150 160 q10 4 20 0" stroke="#2b6cb0" stroke-width="2.5" fill="none"/>
  </g>
</svg>
